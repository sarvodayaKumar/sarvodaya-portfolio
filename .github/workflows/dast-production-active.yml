name: Production Active DAST (Manual, Approval-Gated)

on:
  workflow_dispatch:
    inputs:
      confirm_production_scan:
        description: 'Type CONFIRM-AUTHORIZED-PRODUCTION-DAST to authorize this active scan'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-active-dast
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm production scan authorization
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require explicit authorization
        env:
          CONFIRMATION: ${{ inputs.confirm_production_scan }}
        run: |
          if [ "$CONFIRMATION" != "CONFIRM-AUTHORIZED-PRODUCTION-DAST" ]; then
            echo "::error::Active production DAST requires the exact confirmation phrase."
            exit 1
          fi

  zap-active-scan:
    name: OWASP ZAP active scan (production)
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-active-dast
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run bounded ZAP full scan against the fixed production origin
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: https://sarvodaya.dev
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: >-
            -m 1
            -T 10
            -z "-config spider.maxDepth=2 -config spider.skipurl=(?i).*(logout|signout|delete|destroy|remove|moderation|approve|reject).* -config ascan.maxScanDurationInMins=10 -config ascan.maxRuleDurationInMins=2 -config ascan.threadPerHost=1 -config ascan.delayInMs=1000"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-production-active-dast-reports
