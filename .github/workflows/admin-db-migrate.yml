name: Production database migration (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Type RUN-PRODUCTION-ADMIN-MFA-MIGRATION to authorize the idempotent schema migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply production admin/auth schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require explicit migration authorization
        env:
          CONFIRMATION: ${{ inputs.confirm_migration }}
        run: |
          if [ "$CONFIRMATION" != "RUN-PRODUCTION-ADMIN-MFA-MIGRATION" ]; then
            echo "::error::The exact production migration confirmation phrase is required."
            exit 1
          fi

      - name: Require migration dispatch from reviewed main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this production migration only from the reviewed main branch."
            exit 1
          fi

      - name: Check out the exact reviewed dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Add PRODUCTION_DATABASE_URL as a secret in the GitHub production environment."
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::PRODUCTION_DATABASE_URL must be a PostgreSQL connection URL."
              exit 1
              ;;
          esac

      - name: Apply idempotent database schema migration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            if (!process.env.DATABASE_URL?.startsWith("postgres")) {
              throw new Error("Production DATABASE_URL is missing or invalid");
            }
            await import("./scripts/init-comments-db.mjs");
          '
